<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lila i engleski</title>
<meta name="theme-color" content="#D6EDFF">
<meta name="description" content="Igra za učenje engleskog za djecu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lila">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --ink:#3E2F6B; --ink-soft:rgba(62,47,107,.55); --pink:#FF7EB6; --pink-deep:#E0548F;
  --lilac:#A98BFF; --mint:#6FD6B5; --butter:#FFD95E; --butter-deep:#E9B434;
  --paper:#FFFFFF; --shadow:rgba(62,47,107,.15);
  --sky-top:#D6EDFF; --sky-mid:#EFE4FF; --sky-low:#FFE4F1;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%);
  color:var(--ink); font-family:'Nunito',ui-rounded,system-ui,sans-serif; font-size:16px;
  overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  touch-action:manipulation;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 90px 34px at 12% 14%,rgba(255,255,255,.85) 98%,transparent),
    radial-gradient(ellipse 60px 28px at 17% 11%,rgba(255,255,255,.85) 98%,transparent),
    radial-gradient(ellipse 110px 38px at 86% 22%,rgba(255,255,255,.7) 98%,transparent),
    radial-gradient(ellipse 70px 30px at 80% 19%,rgba(255,255,255,.7) 98%,transparent),
    radial-gradient(ellipse 120px 40px at 70% 92%,rgba(255,255,255,.55) 98%,transparent);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:4px solid var(--lilac);outline-offset:3px}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box;max-width:1100px;margin-inline:auto}
.h{font-family:'Baloo 2',ui-rounded,system-ui,sans-serif}

/* ---------- mascot ---------- */
.lila svg{width:100%;height:auto;display:block;overflow:visible}
.lila .mouth{transform-box:fill-box;transform-origin:center}
.lila.talk .mouth{animation:talk .22s ease-in-out infinite alternate}
.lila.talk svg{animation:bob .5s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.15,1.9)}}
@keyframes bob{to{transform:translateY(-3px) rotate(-2deg)}}

/* ---------- start ---------- */
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.lila-big{width:min(56vw,36vh,280px);animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.logo{margin:0;font-family:'Baloo 2',ui-rounded,system-ui,sans-serif;font-weight:800;line-height:.86;
  font-size:clamp(56px,15vw,104px);color:var(--pink);letter-spacing:-.01em;
  text-shadow:0 4px 0 #fff,0 9px 0 var(--shadow)}
.logo small{display:block;font-size:.4em;color:var(--ink);font-weight:700;letter-spacing:.02em;text-shadow:0 3px 0 #fff}
.play{width:124px;height:124px;border-radius:50%;background:var(--pink);box-shadow:0 9px 0 var(--pink-deep);display:grid;place-items:center;transition:transform .12s;margin-top:6px}
.play svg{width:58px;height:58px;fill:#fff;margin-left:8px}
.play:active{transform:translateY(6px);box-shadow:0 3px 0 var(--pink-deep)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.note{max-width:34em;font-size:14px;line-height:1.45;color:var(--ink-soft);margin:6px 0 0;text-wrap:balance}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:12px;padding-block:12px 10px;flex:0 0 auto}
.ibtn{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:var(--paper);display:grid;place-items:center;
  box-shadow:0 5px 0 var(--shadow);transition:transform .12s}
.ibtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.ibtn svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.sun{background:var(--butter);box-shadow:0 5px 0 var(--butter-deep)}
.lila.mini{width:60px;flex:0 0 auto}
.grow{flex:1}
.bubble{background:#fff;border-radius:20px 20px 20px 6px;padding:8px 14px;font-family:'Baloo 2',ui-rounded,sans-serif;font-weight:700;font-size:20px;box-shadow:0 4px 0 var(--shadow)}
.wtitle{margin:0;flex:1;font-family:'Baloo 2',ui-rounded,sans-serif;font-weight:800;font-size:clamp(22px,5vw,30px);line-height:1.1;text-wrap:balance}
.dots{flex:1;min-width:0;display:flex;justify-content:center;gap:6px}
.dots i{flex:0 0 auto;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 3px rgba(62,47,107,.12);transition:background .3s,transform .3s}
.dots i.on{background:var(--butter);box-shadow:inset 0 0 0 3px var(--butter-deep);transform:scale(1.15)}

/* ---------- map ---------- */
.map{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-content:start;padding-block:6px 28px}
@media (min-width:680px){.map{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--bg);border-radius:34px;padding:16px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 8px 0 var(--shadow),inset 0 -10px 0 rgba(255,255,255,.35);transition:transform .12s}
.tile:active{transform:translateY(5px);box-shadow:0 3px 0 var(--shadow),inset 0 -10px 0 rgba(255,255,255,.35)}
.tile-ico{font-size:clamp(54px,14vw,78px);line-height:1.15;filter:drop-shadow(0 4px 0 rgba(255,255,255,.8))}
.tile-name{font-family:'Baloo 2',ui-rounded,sans-serif;font-weight:700;font-size:17px;line-height:1.15;text-align:center}
.stars{display:flex;gap:2px}
.stars i{font-style:normal;font-size:24px;line-height:1;color:rgba(62,47,107,.16)}
.stars i.on{color:#FFB800;text-shadow:0 2px 0 #fff}
.tile.album-tile{background:#fff}
.tile .count{font-family:'Baloo 2',ui-rounded,sans-serif;font-weight:800;font-size:22px;color:var(--pink)}

/* ---------- world ---------- */
.world{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:18px;padding-bottom:24px}
.hint{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink-soft);margin:0 0 4px}
.hint svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.learn-row{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:none}
.learn-row::-webkit-scrollbar{display:none}
.lcard{flex:0 0 92px;height:92px;border-radius:24px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--shadow);transition:transform .12s}
.lcard .emo{font-size:52px}
.lcard .pic{width:56%}
.lcard .apples{width:80%}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mode{background:#fff;border-radius:32px;padding:20px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 8px 0 var(--shadow);transition:transform .12s}
.mode:active{transform:translateY(5px);box-shadow:0 3px 0 var(--shadow)}
.mode-ico{width:104px;height:104px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:56px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.06)}
.mode-name{font-family:'Baloo 2',ui-rounded,sans-serif;font-weight:700;font-size:19px;line-height:1.1;text-align:center}
.mm{position:relative}
.mm i{position:absolute;width:40px;height:52px;border-radius:10px;background:var(--pink);border:4px solid #fff;box-shadow:0 3px 0 var(--shadow);
  background-image:radial-gradient(circle,#fff 2.5px,transparent 3px);background-size:12px 12px}
.mm i:first-child{transform:translate(-14px,2px) rotate(-12deg)}
.mm i:last-child{transform:translate(14px,-2px) rotate(10deg);background-color:var(--lilac)}
@media (max-width:560px){
  .modes{grid-template-columns:1fr;gap:12px}
  .mode{flex-direction:row;padding:12px 16px;gap:16px;border-radius:28px}
  .mode-ico{width:80px;height:80px;font-size:44px;flex:0 0 auto}
  .mode-name{text-align:left;font-size:21px}
}

/* ---------- game stage ---------- */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-bottom:18px;overflow:auto}
.opts{display:grid;gap:14px;width:min(100%,720px)}
.opts.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.n4{grid-template-columns:repeat(2,minmax(0,1fr));width:min(100%,460px,calc((100vh - 150px)))}
@media (min-width:760px) and (min-aspect-ratio:1/1){.stage:not(.do) .opts.n4{grid-template-columns:repeat(4,minmax(0,1fr));width:min(100%,820px)}}
.card{position:relative;background:#fff;border-radius:28px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 7px 0 var(--shadow);border:5px solid #fff;transition:transform .12s,border-color .2s}
.card:active{transform:translateY(4px);box-shadow:0 3px 0 var(--shadow)}
.card .emo{font-size:clamp(44px,min(15vw,12vh),104px);line-height:1}
.card .pic{width:58%;height:auto}
.card .apples{width:86%}
.card.yes{border-color:var(--mint);animation:yay .6s ease}
.card.yes::after{content:"★";position:absolute;top:4px;right:10px;font-size:30px;color:#FFB800;animation:pop .4s ease both}
@keyframes yay{30%{transform:scale(1.1) rotate(-3deg)}60%{transform:scale(.97) rotate(2deg)}}
.wig{animation:wig .45s ease}
@keyframes wig{20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.emo{line-height:1;display:inline-block}
.emo.big{font-size:clamp(64px,min(22vw,16vh),130px)!important}
.emo.small{font-size:clamp(24px,min(8vw,6vh),48px)!important}
.apples{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:3px 2%}
.apples svg{width:var(--a,26%);height:auto}

/* do-mode layouts */
.stage.do .opts{width:min(100%,420px)}
.stage.do .opts .emo{font-size:clamp(40px,min(12vw,9vh),80px)}
@media (min-aspect-ratio:5/4) and (min-width:640px){.stage.do{flex-direction:row;gap:40px}}
.face-wrap{width:min(68vw,40vh,330px)}
.face-wrap svg,.doll-wrap svg,.kid-wrap svg,.animal svg{width:100%;height:auto;display:block}
.part{transition:fill .4s}
.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 9px #FF7EB6);opacity:.8}}

.wear{opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .25s,transform .45s cubic-bezier(.3,1.6,.6,1)}
.wear.on{opacity:1;transform:none}
.doll-wrap{position:relative;width:min(50vw,34vh,250px);container-type:inline-size}
.slot{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none}
.s-head{left:50%;top:9%;font-size:36cqw}
.s-eyes{left:50%;top:21.5%;font-size:25cqw}
.s-neck{left:50%;top:34%;font-size:24cqw}
.s-body{left:50%;top:54%;font-size:46cqw}
.s-handL{left:21%;top:62%;font-size:20cqw}
.s-handR{left:79%;top:62%;font-size:17cqw}
.s-feet{left:50%;top:93%;font-size:22cqw}

.feed .scene{display:flex;flex-direction:column;align-items:center;gap:0}
.animal{width:min(46vw,30vh,230px)}
.animal.munch svg{animation:bob .25s ease-in-out 4 alternate}
.trough{width:min(82vw,420px);min-height:78px;margin-top:-6px;background:#C98B5A;border-radius:14px 14px 40px 40px;
  box-shadow:inset 0 10px 0 #A86E42,0 6px 0 var(--shadow);display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px;padding:14px 12px 10px;box-sizing:border-box}
.tapple{width:40px;height:44px}
.tapple svg{width:100%;height:100%}
.feed-ctl{display:flex;gap:22px;align-items:center}
.bigbtn{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;transition:transform .12s;position:relative}
.bigbtn:active{transform:translateY(5px)}
.basket{background:#fff;box-shadow:0 8px 0 var(--shadow);font-size:60px}
.basket .mini-apple{position:absolute;top:10px;right:14px;width:36px}
.okb{background:var(--mint);box-shadow:0 8px 0 #45B592}
.okb svg{width:56px;height:56px;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}

.forest{position:relative;width:min(100%,800px,calc((100vh - 140px) * 4 / 3));aspect-ratio:4/3;border-radius:34px;overflow:hidden;container-type:inline-size;
  background:radial-gradient(circle at 85% 16%,#FFF3A8 0 6%,transparent 6.5%),linear-gradient(180deg,#CDEBFF 0 34%,#B8E6A6 34% 60%,#96D98A 60%);
  box-shadow:0 8px 0 var(--shadow)}
.deco{position:absolute;transform:translate(-50%,-50%);pointer-events:none;line-height:1}
.critter{position:absolute;transform:translate(-50%,-50%);line-height:1;padding:2cqw;border-radius:50%;transition:transform .15s}
.critter:active{transform:translate(-50%,-50%) scale(.92)}
.critter.hop{animation:hop .7s ease}
@keyframes hop{40%{transform:translate(-50%,-80%) scale(1.15)}}

.opts.scenes{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,900px)}
.opts.scenes .card{aspect-ratio:4/3}
.opts.scenes svg{width:100%;height:100%}
@media (max-width:600px){.opts.scenes{grid-template-columns:1fr;width:min(100%,calc((100vh - 190px) / 3 * 1.33))}}

.kid-wrap{width:min(78vw,calc((100vh - 150px) / 1.64),300px)}
.hit{fill:#000;fill-opacity:0}
.bp{cursor:pointer}
.bp.flash{animation:flash .9s ease}
@keyframes flash{30%,70%{filter:drop-shadow(0 0 6px #FFD95E) drop-shadow(0 0 12px #FFB800)}}

/* ---------- memory ---------- */
.mem{display:grid;gap:12px;width:min(100%,720px)}
.mem.m3{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,560px,calc((100vh - 150px) * 1.4))}
.mem.m4{grid-template-columns:repeat(4,minmax(0,1fr));width:min(100%,760px,calc((100vh - 150px) * 1.9))}
.mcard{position:relative;aspect-ratio:3/4;perspective:800px}
.mcard .face{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s ease;box-shadow:0 6px 0 var(--shadow)}
.mcard .back{background-color:var(--lilac);border:5px solid #fff;background-image:radial-gradient(circle,rgba(255,255,255,.9) 3px,transparent 3.5px);background-size:18px 18px}
.mcard .back::after{content:"★";font-size:40px;color:#fff}
.mcard .front{background:#fff;transform:rotateY(180deg);border:5px solid #fff}
.mcard.open .back{transform:rotateY(180deg)}
.mcard.open .front{transform:rotateY(0)}
.mcard.match .front{border-color:var(--mint);animation:yay .6s ease}
.mcard .emo{font-size:clamp(34px,min(11vw,9vh),80px)}
.mcard .pic{width:56%}
.mcard .apples{width:84%}

/* ---------- reward ---------- */
.reward{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(239,228,255,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px}
.rw-card{background:#fff;border-radius:44px;padding:26px 26px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 12px 0 var(--shadow);max-width:100%}
.rw-stk{font-size:clamp(96px,30vw,150px);line-height:1.1;animation:spin-in .9s cubic-bezier(.3,1.5,.5,1) both}
.stk-look{filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 6px 6px rgba(62,47,107,.28))}
@keyframes spin-in{from{transform:scale(0) rotate(-200deg)}}
.rw-title{font-family:'Baloo 2',ui-rounded,sans-serif;font-weight:800;font-size:30px;color:var(--pink);margin:0}
.rw-btns{display:flex;gap:16px;margin-top:6px}
.rw-btns .ibtn{width:72px;height:72px}
.rw-btns .ibtn svg{width:36px;height:36px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ---------- album ---------- */
.album{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-content:start;padding-block:6px 24px;width:min(100%,680px);margin-inline:auto}
@media (min-width:700px){.album{grid-template-columns:repeat(6,minmax(0,1fr));width:min(100%,900px)}}
.stk{aspect-ratio:1;border-radius:26px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--shadow);font-size:clamp(38px,11vw,64px);line-height:1}
.stk.empty{background:rgba(255,255,255,.4);box-shadow:none;border:3px dashed rgba(62,47,107,.18);color:rgba(62,47,107,.22);font-family:'Baloo 2',ui-rounded,sans-serif;font-weight:800;font-size:34px}
.pill{font-family:'Baloo 2',ui-rounded,sans-serif;font-weight:800;font-size:20px;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 var(--shadow);color:var(--pink);font-variant-numeric:tabular-nums}

/* ---------- map extras ---------- */
.lock{position:relative;isolation:isolate;width:48px;height:48px;opacity:.75}
.lock svg{width:24px;height:24px}
.lock .ring{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--pink) calc(var(--p,0)*1turn),transparent 0);z-index:-1}
.tile.review-tile{background:linear-gradient(135deg,#FFE9A8,#FFC6E2)}
.modes{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.modes{grid-template-columns:1fr}}

/* ---------- speak ---------- */
.say-card{width:min(62vw,34vh,260px)}
.mic{width:124px;height:124px;border-radius:50%;background:var(--pink);box-shadow:0 9px 0 var(--pink-deep);display:grid;place-items:center;position:relative;transition:transform .12s}
.mic:active{transform:translateY(5px);box-shadow:0 4px 0 var(--pink-deep)}
.mic svg{width:58px;height:58px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mic.on::before,.mic.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid var(--pink);animation:ripple 1.2s ease-out infinite}
.mic.on::after{animation-delay:.6s}
@keyframes ripple{to{transform:scale(1.7);opacity:0}}
.mic.ready{animation:pulse 1.4s ease-in-out infinite}
.mic-hint{margin:0;min-height:1.5em;font-weight:800;font-size:18px;color:var(--ink-soft);text-align:center}

/* ---------- place (plate, party) ---------- */
.place-wrap{position:relative;width:min(66vw,40vh,340px);container-type:inline-size}
.place-wrap svg{width:100%;height:auto;display:block}
.place-wrap .slot{font-size:18cqw}

/* ---------- sky ---------- */
.sky{position:relative;width:min(80vw,40vh,380px);aspect-ratio:1;border-radius:34px;overflow:hidden;container-type:inline-size;background:var(--skybg,#CFE8FF);transition:background .6s;box-shadow:0 8px 0 var(--shadow)}
.sky .ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--grd,#9EDB8E);transition:background .6s}
.sky span{position:absolute;line-height:1;pointer-events:none}
.sky .sun{left:50%;top:38%;transform:translate(-50%,-50%);font-size:34cqw;animation:spinslow 12s linear infinite}
.sky .sun.small{left:80%;top:18%;font-size:16cqw}
@keyframes spinslow{to{transform:translate(-50%,-50%) rotate(360deg)}}
.sky .cloud{font-size:30cqw;animation:drift 5s ease-in-out infinite alternate}
.sky .c1{left:8%;top:6%}.sky .c2{left:48%;top:12%;animation-delay:-2s}.sky .c3{left:26%;top:34%;font-size:22cqw;animation-delay:-1s}
@keyframes drift{to{transform:translateX(12%)}}
.sky .fall{top:-10%;font-size:7cqw;animation:fall 1.6s linear infinite}
@keyframes fall{to{transform:translateY(125cqw)}}
.sky .fly{left:-10%;font-size:8cqw;animation:fly 2s linear infinite}
@keyframes fly{to{transform:translate(125cqw,-10cqw) rotate(360deg)}}
.sky .rainbow{left:50%;top:44%;transform:translate(-50%,-50%);font-size:52cqw}
.sky .bolt{left:44%;top:36%;font-size:20cqw;animation:bolt 1.4s steps(1) infinite}
@keyframes bolt{0%,60%{opacity:0}62%,80%{opacity:1}}

/* ---------- move (Lila kaže) ---------- */
.mover{position:relative;width:min(48vw,30vh,220px)}
.act-fx{position:absolute;right:-18%;top:-8%;font-size:44px;animation:floaty 1.6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-12px) rotate(8deg)}}
.lila.act-jump svg{animation:aj .6s ease-in-out infinite}
@keyframes aj{50%{transform:translateY(-28%)}}
.lila.act-run svg{animation:ar .22s linear infinite alternate}
@keyframes ar{from{transform:translateX(-12%) rotate(-5deg)}to{transform:translateX(12%) rotate(5deg)}}
.lila.act-dance svg{animation:ad .9s ease-in-out infinite}
@keyframes ad{25%{transform:rotate(-15deg) translateY(-6%)}75%{transform:rotate(15deg) translateY(-6%)}}
.lila.act-sleep svg{animation:as 2.4s ease-in-out infinite}
@keyframes as{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(-18deg) scale(1.05)}}
.lila.act-swim svg{animation:aw 1s ease-in-out infinite}
@keyframes aw{50%{transform:translate(8%,6%) rotate(10deg)}}
.lila.act-clap svg{animation:acl .3s ease-in-out infinite alternate}
@keyframes acl{to{transform:scale(1.1)}}
.lila.act-sing svg{animation:bob .45s ease-in-out infinite alternate}
.lila.act-wave svg{animation:awv .6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes awv{50%{transform:rotate(10deg)}}
.okrow{display:flex;justify-content:center}

/* ---------- house (family hide & seek) ---------- */
.forest.house{background:linear-gradient(180deg,#FFE7D1 0 62%,#E5B585 62%);}

/* ---------- parents ---------- */
.parents{flex:1;min-height:0;overflow:auto;padding-bottom:32px;font-size:16px;line-height:1.45}
.parents section{background:#fff;border-radius:24px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:0 4px 0 var(--shadow)}
.parents h3{margin:0 0 10px;font-family:'Baloo 2',ui-rounded,sans-serif;font-weight:800;font-size:21px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.kpi{border-radius:18px;padding:12px;background:var(--kbg)}
.kpi b{display:block;font-family:'Baloo 2',ui-rounded,sans-serif;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px 4px 6px;font-weight:700;font-size:15px;background:#F1EEF8}
.chip .cp{font-size:18px;line-height:1;min-width:20px;text-align:center}
.chip .cp i{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle}
.chip.st-hard{background:#FFE0E4}.chip.st-learned{background:#D5F5EA}.chip.st-practice{background:#FFF1C7}.chip.st-new{background:#F1EEF8;color:var(--ink-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.seg{display:inline-flex;background:#F1EEF8;border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border-radius:999px;padding:8px 16px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.setrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
.setrow > span{font-weight:800;min-width:9em}
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding-block:12px;border-top:1px solid #EEE8F7}

.wrow .wi{font-size:30px}

.switch{position:relative;width:56px;height:32px;border-radius:999px;background:#D9D2E9;transition:background .2s;flex:0 0 auto}

.switch[aria-checked="true"]{background:var(--mint)}

.seg-btn{background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800}
.bk{width:100%;box-sizing:border-box;border:2px solid #E4DAF5;border-radius:16px;padding:10px 12px;font:14px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:#FBF9FF;resize:vertical;user-select:text;-webkit-user-select:text}

.bkmsg{font-weight:700;color:var(--ink-soft)}
.acct{min-height:44px;display:flex;justify-content:center}
.linkbtn{background:rgba(255,255,255,.8);border-radius:999px;padding:10px 18px;font-weight:800;color:var(--ink);box-shadow:0 3px 0 var(--shadow)}
.linkbtn.small{background:none;box-shadow:none;padding:6px 0;text-decoration:underline;font-weight:700}
.who{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 18px 6px 6px;box-shadow:0 4px 0 var(--shadow);text-align:left}
.who-av{width:44px;height:44px;border-radius:50%;background:#FFE4F1;display:grid;place-items:center;font-size:28px}
.who b{display:block;font-family:'Baloo 2',ui-rounded,sans-serif;font-size:20px;line-height:1.1}
.who small{font-weight:700;color:var(--ink-soft)}
.form label{display:block;font-weight:800;margin:12px 0 6px}
.form input[type=email],.form input[type=password],.form input:not([type]){width:100%;box-sizing:border-box;border:2px solid #E4DAF5;border-radius:14px;padding:12px 14px;font:inherit;font-size:17px;color:var(--ink);background:#FBF9FF;user-select:text;-webkit-user-select:text}

function hrVoices(vs){
  const hr=vs.filter(v=>/^hr/i.test(v.lang));
  const list=hr.length?hr:vs.filter(v=>/^(bs|sr-latn)/i.test(v.lang));
  const score=v=>(/natural|neural|enhanced|premium|poboljšan|online/i.test(v.name)?4:0)+(/lana|gabrijela|female|žensk|hr-hr-x-.*-(local|network)/i.test(v.name)?2:0)+(/google/i.test(v.name)?1:0)-(/male|muški|srecko|srećko/i.test(v.name)&&!/female/i.test(v.name)?3:0);
  return list.sort((a,b)=>score(b)-score(a));
}
function loadVoices(){
  if(!S.ok)return;
  const vs=speechSynthesis.getVoices(); if(!vs.length)return;
  S.loaded=true;
  S.hrList=hrVoices(vs);
  S.hr=S.hrList.find(v=>v.voiceURI===P.settings.hrVoice)||S.hrList[0]||null;
  const en=vs.filter(v=>/^en/i.test(v.lang));
  const pref=['Google UK English Female','Serena','Kate','Martha','Stephanie','Libby','Sonia','Maisie','Female'];
  S.en=null;
  const us=P.settings.accent==='us';
  const A=us?/en[-_]US/i:/en[-_]GB/i, B=us?/en[-_]GB/i:/en[-_]US/i;
  const prefUS=['Google US English','Samantha','Ava','Allison','Jenny','Aria','Female'];
  for(const p of (us?prefUS:pref)){S.en=en.find(v=>A.test(v.lang)&&v.name.includes(p));if(S.en)break}
  S.en=S.en||en.find(v=>A.test(v.lang))||en.find(v=>B.test(v.lang))||en[0]||null;
}

function talk(on){$$('.lila').forEach(el=>el.classList.toggle('talk',on))}
let sayTok=0;
function say(parts){
  const tok=++sayTok;
  return new Promise(res=>{
    if(!S.ok||!parts||!parts.length){res();return}
    speechSynthesis.cancel();
    setTimeout(()=>{
      if(tok!==sayTok){res();return}
      let done=false;const fin=()=>{if(done)return;done=true;if(tok===sayTok)talk(false);res()};
      parts.forEach(([l,t],i)=>{
        const u=new SpeechSynthesisUtterance(t);
        if(l==='hr'){const soft=P.settings.hrTone!=='cheerful';u.lang='hr-HR';if(S.hr)u.voice=S.hr;u.rate=soft?.88:1;u.pitch=soft?.96:1.12;if(soft)u.text=t.replace(/!/g,'.')}
        else{u.lang=S.en?S.en.lang:(P.settings.accent==='us'?'en-US':'en-GB');if(S.en)u.voice=S.en;u.rate=P.settings.slow?.74:.9;u.pitch=1.1}
        u.onstart=()=>{if(tok===sayTok)talk(true)};
        if(i===parts.length-1){u.onend=fin;u.onerror=fin}
        speechSynthesis.speak(u);
      });
      const len=parts.reduce((a,p)=>a+p[1].length,0);
      setTimeout(fin,3500+len*120);
    },70);
  });
}

function tone(fs,{dur=.14,type='sine',gap=.09,vol=.16}={}){
  const a=ac();if(!a)return;const t0=a.currentTime+.01;
  fs.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
    const t=t0+i*gap;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur+.2);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.25)});
}

  c.width=W_*d;c.height=H_*d;x.scale(d,d);
  const cols=['#FF7EB6','#A98BFF','#6FD6B5','#FFD95E','#7CC4FF','#FF9E7A'];
  const ps=Array.from({length:150},()=>({x:W_/2+(Math.random()-.5)*80,y:H_*.42,vx:(Math.random()-.5)*16,vy:-Math.random()*15-5,r:Math.random()*7+5,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3,s:Math.random()<.4}));
  let t=0;(function f(){x.clearRect(0,0,W_,H_);ps.forEach(p=>{p.vy+=.36;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
    if(p.s){x.beginPath();x.arc(0,0,p.r/1.7,0,7);x.fill()}else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++t<160)requestAnimationFrame(f);else c.remove()})();
}

/* ---------- learning memory: weak words come back more often ---------- */
let W=null,G=null,RUN=0;
const k=w=>w._wid+':'+w.gb;
function wt(w){const s=P.stats[k(w)]||{c:0,w:0};return Math.max(.35,1+(s.c===0?1.2:0)+s.w*1.6-Math.min(s.c,8)*.1)}
function pickW(list,avoid){
  const l=list.length>1&&avoid?list.filter(x=>x!==avoid):list;
  const ws=l.map(wt);let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<l.length;i++){r-=ws[i];if(r<=0)return l[i]}return l[l.length-1];
}
function pickDistinct(list,n){const out=[];while(out.length<n){out.push(pickW(list.filter(x=>!out.includes(x))))}return out}
function mark(w,ok){const s=P.stats[k(w)]||(P.stats[k(w)]={c:0,w:0});if(ok){s.c++;s.w=Math.max(0,s.w-.5)}else s.w++;save()}
const level=()=>P.stars[W.id]||0;
const alive=r=>r===RUN;
function tryAgain(){return['hr',pick(['Skoro! Probaj još jednom.','Nema veze, probaj opet.','Hajde, probaj još jednom.'])]}
function praise(){return Math.random()<.35?['en',pick(['Well done!','Great job!','Yes!','Super!'])]:['hr',pick(['Bravo!','Super!','Odlično!','Tako je!','Jako dobro!','Jupi!'])]}

async function intro(text){const r=G.r;G.prompt=[['hr',text]];await say(G.prompt);return alive(r)}
async function right(w,extra=[]){
  G.lock=true;chime();mark(w,!G.missed);G.done++;setDots();
  const r=G.r;await say([...extra,praise()]);return alive(r);
}
function wrong(w,parts){if(!G.missed){mark(w,false);G.missed=true}boop();say(parts)}
function wiggle(el){el.classList.remove('wig');void el.getBoundingClientRect();el.classList.add('wig')}

/* --- ponavljanje: riječi koje je već vidjela, najteže prve --- */
function reviewPool(){
  const ids=shown().map(w=>w.id);
  return ALLW().filter(w=>ids.includes(w._wid)&&P.stats[k(w)]).sort((a,b)=>wt(b)-wt(a));
}
function startReview(){
  const pool=reviewPool().slice(0,8);
  W={id:'review',name:'Ponavljanje',words:pool,say:'Ponavljanje!'};
  startGame('listen');
}
function bindLock(el){
  let t=null,start=0,raf=0;
  const ring=el.querySelector('.ring');
  const stop=()=>{clearTimeout(t);cancelAnimationFrame(raf);ring.style.setProperty('--p',0)};
  const tick=()=>{const p=Math.min(1,(performance.now()-start)/2000);ring.style.setProperty('--p',p);if(p<1)raf=requestAnimationFrame(tick)};
  el.addEventListener('pointerdown',e=>{e.preventDefault();start=performance.now();tick();t=setTimeout(()=>{stop();renderParents()},2000)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('click',()=>{if(!t||performance.now()-start<1900)say([['hr','Ovo je za mamu i tatu.']])});
}

const Listen={
  async start(){
    G.total=6;G.targets=[];let last=null;for(let i=0;i<6;i++){last=pickW(W.words,last);G.targets.push(last)}
    if(W.id!=='review'){
      // dvije stare riječi iz drugih svjetova, najteže imaju prednost
      const old=reviewPool().filter(w=>w._wid!==W.id).slice(0,6);
      shuffle(old).slice(0,2).forEach((w,j)=>{G.targets[j?4:2]=w});
    }
    app.innerHTML=header(6)+`<main class="stage"><div class="opts" id="opts"></div></main>`;bindHeader();

    if(await intro('Slušaj riječ i dodirni pravu sliku!'))this.ask();
  },
  ask(){
    const t=G.targets[G.i];const n=level()>=1?4:3;
    const home=WORLDS.find(x=>x.id===t._wid).words;
    const opts=shuffle([t,...shuffle(home.filter(x=>x!==t&&x.en!==t.en)).slice(0,n-1)]);
    Object.assign(G,{t,missed:false,lock:false});
    const box=$('#opts');box.className='opts n'+n;box.innerHTML=optsHTML(opts);
    G.prompt=[['en',t.en]];
    say(t._wid!==W.id&&W.id!=='review'?[['hr','Sjećaš li se?'],...G.prompt]:G.prompt);
  },
  async tap(b){
    if(G.lock)return;const w=G.cur[+b.dataset.i];
    if(w===G.t){b.classList.add('yes');if(await right(w,[['en',w.en]]))next(()=>this.ask())}
    else{wiggle(b);wrong(G.t,[['en',w.en],tryAgain(),['en',G.t.en]])}
  }
};

    app.innerHTML=header(n)+`<main class="stage"><div class="mem m${n}" id="mem">${cards.map(w=>`<button class="mcard" data-i="${W.words.indexOf(w)}" aria-label="Kartica"><span class="face back"></span><span class="face front">${pic(w)}</span></button>`).join('')}</div></main>`;
    bindHeader();G.open=[];G.lock=false;G.missed=false;
    $('#mem').onclick=e=>{const b=e.target.closest('.mcard');if(b)this.tap(b)};
    await intro('Okreni dvije kartice i nađi par!');
  },
  async tap(b){
    if(G.lock||b.classList.contains('open'))return;
    b.classList.add('open');const w=W.words[+b.dataset.i];G.open.push(b);say([['en',w.en]]);
    if(G.open.length<2)return;
    G.lock=true;const[a,c]=G.open;G.open=[];const r=G.r;
    if(a.dataset.i===c.dataset.i){
      await wait(650);if(!alive(r))return;
      a.classList.add('match');c.classList.add('match');chime();mark(w,true);G.done++;setDots();
      await say([praise(),['en',w.en]]);if(!alive(r))return;
      G.lock=false;if(G.done>=G.total)finish();
    }else{
      await wait(1300);if(!alive(r))return;
      a.classList.remove('open');c.classList.remove('open');G.lock=false;
    }
  }
};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recOK=!!SR;
function listenOnce(ms=6000){
  return new Promise(res=>{
    if(!recOK){res({mode:'fake'});return}
    let r;try{r=new SR()}catch(e){recOK=false;res({mode:'fake'});return}
    r.lang=P.settings.accent==='us'?'en-US':'en-GB';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
    let done=false;const fin=x=>{if(done)return;done=true;try{r.abort()}catch(e){}res(x)};
    r.onresult=e=>fin({mode:'real',alts:[...e.results[0]].map(a=>a.transcript.toLowerCase())});
    r.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture','network'].includes(e.error)){recOK=false;fin({mode:'fake'})}else fin({mode:'real',alts:[]})};
    r.onend=()=>fin({mode:'real',alts:[]});
    try{r.start()}catch(e){recOK=false;fin({mode:'fake'})}
    setTimeout(()=>fin({mode:'real',alts:[]}),ms);
  });
}
function heard(alts,w){
  const keys=w.en.toLowerCase().split(' ').filter(x=>x.length>2);if(w.n)keys.push(String(w.n));if(w.gb!==w.en)keys.push(w.gb);
  return alts.some(a=>keys.some(x=>a.includes(x)));
}

function backupCode(){return'LILA1:'+btoa(unescape(encodeURIComponent(JSON.stringify({stars:P.stars,stickers:P.stickers,stats:P.stats,settings:P.settings}))))}
function restoreCode(txt){
  try{const m=String(txt).replace(/\s+/g,'').match(/LILA1:([A-Za-z0-9+/=]+)/);if(!m)return false;
    const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!d||typeof d.stats!=='object'||typeof d.stars!=='object'||!Array.isArray(d.stickers))return false;
    P={updatedAt:0,stars:d.stars,stickers:d.stickers.filter(i=>Number.isInteger(i)&&i>=0&&i<STICKERS.length),stats:d.stats,settings:Object.assign(DEF_SET(),d.settings||{})};
    save();applyAccent();loadVoices();return true}catch(e){return false}
}
// zamoli preglednik da ne briše spremljeni napredak kad mu treba mjesta
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
/* ---------- prijava roditelja i dječji profili (rade samo kad je spojen oblak) ---------- */
const AVATARS=['🦄','🐰','🐱','🦊','🐼','🐸','🦋','🌸','🐬','🐻'];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function acctUI(){
  const el=$('#acct');if(!el)return;
  if(!window.Cloud){el.innerHTML='';return}
  if(!Cloud.user){el.innerHTML=`<button class="linkbtn" id="toLogin">Prijava roditelja · napredak na svim uređajima</button>`;$('#toLogin').onclick=()=>renderLogin();return}
  if(CUR){el.innerHTML=`<button class="who" id="who"><span class="who-av">${CUR.avatar}</span><span><b>${esc(CUR.name)}</b><small>Promijeni profil</small></span></button>`;$('#who').onclick=()=>renderProfiles();return}
  el.innerHTML=`<button class="linkbtn" id="toProf">Odaberi profil</button>`;$('#toProf').onclick=()=>renderProfiles();
}
window.addEventListener('cloud-auth',()=>{
  const u=window.Cloud&&Cloud.user;
  if(CUR&&(!u||u.uid!==CUR.uid)&&u){CUR=null;try{localStorage.removeItem('lila-cur')}catch(e){}P=load();applyAccent();loadVoices()}
  if(u&&CUR)syncFromCloud(CUR);
  acctUI();
});
window.addEventListener('cloud-ready',()=>acctUI());

function renderLogin(){
  RUN++;hush();
  app.innerHTML=`<header class="bar"><button class="ibtn" id="back" aria-label="Natrag">${IC.back}</button><h2 class="wtitle">Prijava roditelja</h2></header>
  <main class="parents"><section class="form">
    <p>Prijavite se svojim e-mailom. Napredak djeteta tada se sprema na vaš račun i možete ga otvoriti na bilo kojem mobitelu, tabletu ili računalu.</p>
    <label for="lgEmail">E-mail</label><input id="lgEmail" type="email" autocomplete="username" inputmode="email">
    <label for="lgPass">Lozinka</label><input id="lgPass" type="password" autocomplete="current-password" minlength="6">
    <div class="setrow" style="margin-top:14px"><button class="seg-btn" id="lgIn">Prijavi se</button><button class="seg-btn ghost" id="lgUp">Napravi novi račun</button></div>
    <button class="linkbtn small" id="lgReset">Zaboravili ste lozinku?</button>
    <p class="bkmsg" id="lgMsg" role="status"></p>
  </section></main>`;
  $('#back').onclick=()=>renderStart();
  const msg=t=>{$('#lgMsg').textContent=t};
  const go=async fn=>{const e=$('#lgEmail').value.trim(),pw=$('#lgPass').value;if(!e){msg('Upišite e-mail.');return}
    if(fn!=='reset'&&pw.length<6){msg('Lozinka treba imati barem 6 znakova.');return}
    msg('Samo trenutak…');const r=await Cloud[fn](e,pw);
    if(r.ok){if(fn==='reset')msg('Poslali smo vam e-mail za novu lozinku.');else renderProfiles()}else msg(r.msg)};
  $('#lgIn').onclick=()=>go('signIn');$('#lgUp').onclick=()=>go('signUp');$('#lgReset').onclick=()=>go('reset');
}

async function renderProfiles(){
  RUN++;const r=RUN;hush();
  if(!window.Cloud||!Cloud.user){renderLogin();return}
  app.innerHTML=`<header class="bar"><button class="ibtn" id="back" aria-label="Natrag">${IC.back}</button><h2 class="wtitle">Tko se igra?</h2><div class="lila mini">${lilaSVG()}</div></header>
  <main class="profiles"><div class="pgrid" id="pgrid"><p class="bkmsg">Učitavam profile…</p></div>
  <p class="pfoot">Prijavljeni ste kao ${esc(Cloud.user.email||'')} · <button class="linkbtn small" id="logout">Odjava</button></p></main>`;
  $('#back').onclick=()=>renderStart();
  $('#logout').onclick=async()=>{await Cloud.signOut();CUR=null;try{localStorage.removeItem('lila-cur')}catch(e){}P=load();applyAccent();loadVoices();renderStart()};
  say([['hr','Tko se danas igra?']]);
  let list=[];try{list=await Cloud.list()}catch(e){}
  if(!alive(r))return;
  const g=$('#pgrid');
  g.innerHTML=list.map((x,i)=>`<button class="ptile" data-i="${i}"><span class="pav">${x.avatar}</span><span class="pname">${esc(x.name)}</span></button>`).join('')
    +`<button class="ptile add" id="padd"><span class="pav">＋</span><span class="pname">Novi profil</span></button>`;
  if(!list.length&&!navigator.onLine)g.insertAdjacentHTML('afterbegin','<p class="bkmsg" style="grid-column:1/-1">Nema interneta, pa ne mogu učitati profile.</p>');
  g.onclick=e=>{const t=e.target.closest('.ptile');if(!t)return;if(t.id==='padd')newProfile();else selectProfile(list[+t.dataset.i])};
}

function newProfile(){
  RUN++;hush();
  const guest=load(KEY);const has=Object.keys(guest.stats).length>0;
  let av=AVATARS[0];
  app.innerHTML=`<header class="bar"><button class="ibtn" id="back" aria-label="Natrag">${IC.back}</button><h2 class="wtitle">Novi profil</h2></header>
  <main class="parents"><section class="form">
    <label for="pfName">Ime djeteta</label><input id="pfName" maxlength="20" autocomplete="off">
    <label>Sličica</label><div class="avpick" id="avpick">${AVATARS.map((a,i)=>`<button data-a="${a}" aria-pressed="${i===0}">${a}</button>`).join('')}</div>
    ${has?`<label class="chk"><input type="checkbox" id="pfCarry" checked> Prenesi napredak koji je već na ovom uređaju</label>`:''}
    <div class="setrow" style="margin-top:14px"><button class="seg-btn" id="pfSave">Napravi profil</button></div>
    <p class="bkmsg" id="pfMsg" role="status"></p>
  </section></main>`;
  $('#back').onclick=()=>renderProfiles();
  $('#avpick').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;av=b.dataset.a;$$('#avpick button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('#pfSave').onclick=async()=>{
    const name=$('#pfName').value.trim();if(!name){$('#pfMsg').textContent='Upišite ime.';return}
    $('#pfMsg').textContent='Spremam…';
    const data=has&&$('#pfCarry')&&$('#pfCarry').checked?guest:fresh();data.updatedAt=Date.now();
    try{const pr=await Cloud.create(name,av,data);selectProfile(pr,data)}catch(e){$('#pfMsg').textContent='Profil nije spremljen. Provjerite internet i pokušajte ponovno.'}
  };
}

async function syncFromCloud(cur){
  try{const c=await Cloud.fetch(cur.pid);if(!c||!CUR||CUR.pid!==cur.pid)return;
    if((c.data.updatedAt||0)>(P.updatedAt||0)){P=norm(c.data);try{localStorage.setItem(curKey(),JSON.stringify(P))}catch(e){}applyAccent();loadVoices()}
    else if((P.updatedAt||0)>(c.data.updatedAt||0))Cloud.queueSave(CUR,P);
  }catch(e){}
}
async function selectProfile(pr,data){
  CUR={pid:pr.pid,name:pr.name,avatar:pr.avatar,uid:Cloud.user.uid};
  try{localStorage.setItem('lila-cur',JSON.stringify(CUR))}catch(e){}
  P=data?norm(data):load();if(data){try{localStorage.setItem(curKey(),JSON.stringify(P))}catch(e){}}
  await syncFromCloud(CUR);applyAccent();loadVoices();
  greeted=true;renderMap();say([['hr',`Bok, ${pr.name}!`],['en','Hello!'],['hr','Kamo idemo danas?']]);
}
function acctSection(){
  if(!window.Cloud)return'';
  if(!Cloud.user)return`<section><h3>Račun</h3><p>Prijavite se da se napredak sprema na vaš račun i radi na svim uređajima.</p><button class="seg-btn" id="acLogin">Prijava roditelja</button></section>`;
  const st=Cloud.pending?'Čeka internet, spremit će se čim se spojite.':Cloud.lastSync?'Spremljeno u oblak u '+new Date(Cloud.lastSync).toLocaleTimeString('hr-HR',{hour:'2-digit',minute:'2-digit'})+'.':'Sprema se nakon svake runde.';
  return`<section><h3>Račun i profil</h3><p>Prijavljeni ste kao <b>${esc(Cloud.user.email||'')}</b>.${CUR?` Igra profil <b>${CUR.avatar} ${esc(CUR.name)}</b>. ${st}`:' Profil nije odabran, pa se napredak sprema samo na ovom uređaju.'}</p>
    <div class="setrow"><button class="seg-btn" id="acProf">Promijeni profil</button><button class="seg-btn ghost" id="acOut">Odjava</button></div></section>`;
}

renderStart();
</script>
